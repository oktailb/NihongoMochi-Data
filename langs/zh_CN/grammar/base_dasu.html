<h1>突然的行动：～だす</h1>
<p>后缀`～だす`（写作`～出す`）附加在动词后面，表示动作突然或意外地开始。</p>
<h2>1. 句子结构</h2>
<p>将“だす”附加到“动词词干”（“~ます”之前的部分）。</p>
<p>`[动词词干] + だす`</p>
<ul>
<li>
<ruby>急<rt>きゅう</rt></ruby>に<ruby>雨<rt>あめ</rt></ruby>が`<ruby>降<rt>ふ</rt></ruby>りだしました`。<br/>（突然，天开始下雨了。）</li>
<li>
<ruby>赤<rt>あか</rt></ruby>ちゃんが`<ruby>泣<rt>な</rt></ruby>きだした`。<br/>（婴儿突然哭了起来。）</li>
<li>みんなが`<ruby>笑<rt>わら</rt></ruby>いだした`。<br/>（大家都笑了起来。）</li>
</ul>
<h2>2. 细微差别：突然性</h2>
<p>与“～はじめる”（开始）相比，“～だす”强调开始是突然的、冲动的或意外的。</p>
