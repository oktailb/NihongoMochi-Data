<h1>突然的行动：～だす</h1>
<p>后缀<strong>～だす</strong>（写为<strong>～出す</strong>) 附加在动词后表示动作突然或意外地开始。</p>
<h2>1. 句子结构</h2>
<p>附<strong>だす</strong>到<strong>动词词干</strong>（之前的部分<em>〜马苏</em>）。</p>
<p><strong>[动词词干] + だす</strong></p>
<ul>
<li>
<ruby>急<rt>きゅう</rt></ruby>に<ruby>雨<rt>あめ</rt></ruby>が<strong><ruby>降<rt>ふ</rt></ruby>りだしました</strong>。<br/>（突然，天开始下雨了。）</li>
<li>
<ruby>赤<rt>あか</rt></ruby>ちゃんが<strong><ruby>泣<rt>な</rt></ruby>きだした</strong>。<br/>（婴儿突然哭了起来。）</li>
<li>みんなが<strong><ruby>笑<rt>わら</rt></ruby>いだした</strong>。<br/>（大家都笑了起来。）</li>
</ul>
<h2>2. 细微差别：突然性</h2>
<p>相比<em>～はじめる</em>（开始），<strong>～だす</strong>强调开始是突然的、冲动的或意外的。</p>
