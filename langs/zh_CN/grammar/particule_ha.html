<h1>粒子は（主题标记）</h1>
<p>助词“は”（发音为“wa”）是日语中最基本的助词。它标识了你的句子的“主题”——你在说什么。</p>
<h2>1. 功能</h2>
<p>将“は”视为“至于……”或“说到……”的意思。一旦用は确立了主题，后面的句子就不需要重复。</p>
<h2>2. 关键例子</h2>
<ul>
<li>
<ruby>私<rt>わたし</rt></ruby>「は」<ruby>学生<rt>がくせい</rt></ruby>です。<br/>（对于我来说，我是一名学生。）</li>
<li>
<ruby>今日<rt>きょう</rt></ruby>「は」<ruby>暑<rt>あつ</rt></ruby>いです。<br/>（说到今天，天气很热。）</li>
<li>
<ruby>田中<rt>たなか</rt></ruby>さん`は`<ruby>親切<rt>しんせつ</rt></ruby>です。<br/>（至于田中先生，他很友善。）</li>
</ul>
<h2>3. 重要提示</h2>
<p>尽管它是用平假名“は”书写的，但当用作助词时，它总是发音为“わ”。</p>
