<h1>粒子は（主题标记）</h1>
<p>粒子<strong>は</strong>（发音为“wa”）是日语中最基本的助词。它标识了<strong>话题</strong>你的句子的意思——你在说什么。</p>
<h2>1. 功能</h2>
<p>想想<strong>は</strong>意思是“至于……”或“说到……”。一旦用は确立了主题，后面的句子就不需要重复。</p>
<h2>2. 关键例子</h2>
<ul>
<li>
<ruby>私<rt>わたし</rt></ruby><strong>は</strong><ruby>学生<rt>がくせい</rt></ruby>です。<br/>（对于我来说，我是一名学生。）</li>
<li>
<ruby>今日<rt>きょう</rt></ruby><strong>は</strong><ruby>暑<rt>あつ</rt></ruby>いです。<br/>（说到今天，天气很热。）</li>
<li>
<ruby>田中<rt>たなか</rt></ruby>さん<strong>は</strong><ruby>親切<rt>しんせつ</rt></ruby>です。<br/>（至于田中先生，他很友善。）</li>
</ul>
<h2>3. 重要提示</h2>
<p>虽然是用平假名写的<strong>哈</strong>(は)，总是发音<strong>佤族</strong>当用作粒子时。</p>
