<h1>再次修正：～なおす</h1>
<p>后缀<strong>～なおす</strong>用于表示一个动作是<strong>再次完成</strong>，通常是为了改善结果或纠正错误。</p>
<h2>1. 教学注意事项</h2>
<p>它类似于英文前缀“re-”（重做、重读），但特别强调<strong>改进、纠正或重新开始</strong>。如果你第一次犯了错误，你可以使用<em>〜奈苏</em>修复它。</p>
<h2>2. 句子结构</h2>
<ul>
<li>动词（-masu 词干）+<strong>なおす</strong></li>
</ul>
<h2>3. 例子</h2>
<ul>
<li>もう<ruby>一度<rt>いちど</rt></ruby><ruby>考<rt>かんが</rt></ruby>え<strong>なおして</strong>ください。<br/>（请重新考虑[再考虑一下]。）</li>
<li>特斯托奥<ruby>書<rt>か</rt></ruby>き<strong>なおしました</strong>。<br/>（我重写了测试[以纠正错误]。）</li>
<li>
<ruby>読<rt>よ</rt></ruby>み<strong>なおすと</strong>、间い违がよくわかります。<br/>（当你重读时，你可以很容易地发现错误。）</li>
</ul>
